<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F7FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1729" media="(prefers-color-scheme: dark)">
<title>Traduya</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Barra superior: logo pequeño e idioma -->
  <header class="topbar">
    <img class="mini-logo" src="img/emblem.png" alt="">
    <img class="mini-name" src="img/wordmark.png" alt="Traduya">
    <nav class="languages" aria-label="Idioma · Language · 语言">
      <button data-lang="es">ES</button>
      <button data-lang="en">EN</button>
      <button data-lang="zh">中文</button>
    </nav>
  </header>

  <!-- Presentación (se oculta en la pantalla de llamar) -->
  <section class="hero">
    <img class="emblem" src="img/emblem.png" alt="">
    <img class="name" src="img/wordmark.png" alt="Traduya · Intérprete universal de idiomas">
    <p class="sub" data-i18n="subtitle"></p>
  </section>

  <!-- 1. Bienvenida: registrarse o iniciar sesión (obligatorio para llamar) -->
  <section class="card hidden" id="welcomeCard">
    <h2 data-i18n="welcomeTitle"></h2>
    <p class="muted" data-i18n="welcomeWhy"></p>
    <button class="wide primary" id="registerBtn" data-i18n="register"></button>
    <button class="wide secondary" id="signInBtn" data-i18n="signIn"></button>
  </section>

  <!-- 2. Elegir la cuenta de Google -->
  <section class="card hidden" id="googleCard">
    <h2 id="googleTitle"></h2>
    <p class="muted" id="googleHint"></p>
    <button class="wide google" id="googleBtn">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.7A14.6 14.6 0 0 1 9.5 24c0-1.6.3-3.2.9-4.7l-7.8-6A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.9-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.2-8.5 2.2-6.3 0-11.6-4.1-13.5-9.8l-7.9 6C6.6 42.6 14.6 48 24 48z"/></svg>
      <span data-i18n="google"></span>
    </button>
    <button class="link" id="backBtn" data-i18n="back"></button>
    <p class="message" id="googleMessage"></p>
  </section>

  <!-- 3. Registro: nombre completo, teléfono y enlace de confirmación enviado al Gmail -->
  <section class="card form hidden" id="registerCard">
    <h2 data-i18n="registerTitle"></h2>
    <p class="muted" id="registerIntro"></p>

    <form id="profileForm">
      <label for="fullNameInput" data-i18n="fullNameLabel"></label>
      <input id="fullNameInput" autocomplete="name" required>
      <label for="countrySelect" data-i18n="countryLabel"></label>
      <select id="countrySelect"></select>
      <label for="phoneInput" data-i18n="phoneLabel"></label>
      <input id="phoneInput" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="300 123 4567" required>
      <button class="wide primary" type="submit" id="sendLinkBtn" data-i18n="sendLink"></button>
    </form>

    <div id="linkSentBox" class="hidden">
      <div class="mail-icon" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </div>
      <p class="muted" id="linkSentText"></p>
      <div class="links">
        <button class="link" type="button" id="resendBtn" data-i18n="resend"></button>
        <button class="link" type="button" id="changeDataBtn" data-i18n="changeData"></button>
      </div>
    </div>

    <p class="message" id="registerMessage"></p>
    <button class="link" id="otherAccountBtn" data-i18n="useOtherAccount"></button>
  </section>

  <!-- 4. Con la sesión iniciada: teclado para llamar e historial (y se reciben llamadas) -->
  <section class="card hidden" id="callCard">
    <div class="session">
      <span id="sessionName"></span>
      <button class="link" id="signOutBtn" data-i18n="signOut"></button>
    </div>
    <div class="presence" id="presence"><span class="dot"></span><span id="presenceText"></span></div>

    <div class="tabs" role="tablist">
      <button class="active" data-tab="dialTab" data-i18n="tabDial"></button>
      <button data-tab="historyTab" data-i18n="tabHistory"></button>
    </div>

    <div id="dialTab">
      <p class="wifi-only" data-i18n="wifiOnly"></p>
      <select id="dialCountry" aria-label="País"></select>
      <div class="dial-display">
        <span id="dialPrefix"></span><span id="dialNumber"></span>
        <button type="button" class="dial-delete" id="dialDelete" aria-label="Borrar">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/></svg>
        </button>
      </div>
      <div class="target-status hidden" id="targetStatus"><span class="dot"></span><span id="targetStatusText"></span></div>
      <div class="keypad" id="keypad"></div>
      <div class="status" id="status"></div>
      <div class="actions">
        <div>
          <button class="round call" id="callBtn"><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></button>
          <div class="label" data-i18n="call"></div>
        </div>
      </div>
    </div>

    <div id="historyTab" class="hidden">
      <p class="muted center hidden" id="historyEmpty" data-i18n="historyEmpty"></p>
      <ul class="history-list" id="historyList"></ul>
      <div id="historyDetail" class="hidden">
        <button class="link" id="historyBackBtn" data-i18n="back"></button>
        <h3 id="detailTitle"></h3>
        <p class="muted" id="detailMeta"></p>
        <audio id="detailAudio" controls class="hidden"></audio>
        <p class="muted small hidden" id="detailNoAudio" data-i18n="noRecordingHere"></p>
        <ul class="transcript" id="detailLines"></ul>
      </div>
    </div>

    <div class="notice" data-i18n="notice"></div>
  </section>

  <!-- 5. Llamada entrante -->
  <section class="card hidden" id="incomingCard">
    <div class="avatar" id="incomingAvatar"></div>
    <h2 id="incomingName"></h2>
    <p class="muted" id="incomingPhone"></p>
    <p class="ringing" data-i18n="incoming"></p>
    <div class="actions">
      <div>
        <button class="round hang" id="declineBtn"><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1a1 1 0 0 1-.56.9 11.5 11.5 0 0 0-2.66 1.85 1 1 0 0 1-1.41 0L.29 13.08a1 1 0 0 1 0-1.41A16.9 16.9 0 0 1 12 7c4.57 0 8.72 1.8 11.71 4.67a1 1 0 0 1 0 1.41l-2.48 2.49a1 1 0 0 1-1.41 0 11.3 11.3 0 0 0-2.67-1.85 1 1 0 0 1-.55-.9v-3.1A15 15 0 0 0 12 9z"/></svg></button>
        <div class="label" data-i18n="decline"></div>
      </div>
      <div>
        <button class="round call" id="answerBtn"><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></button>
        <div class="label" data-i18n="answer"></div>
      </div>
    </div>
  </section>

  <!-- 6. Llamada en curso: la traducción en vivo de lo que dice la otra persona -->
  <section class="card hidden" id="inCallCard">
    <div class="call-head">
      <div class="avatar small" id="callAvatar"></div>
      <div>
        <div class="call-name" id="callName"></div>
        <div class="muted small" id="callMeta"></div>
      </div>
    </div>
    <div class="lang-pill" id="langPill"></div>
    <div class="live-area">
      <ul class="transcript" id="callLines"></ul>
      <p class="live-text" id="liveText"></p>
      <p class="muted small center" id="callHint"></p>
    </div>
    <div class="actions">
      <div>
        <button class="round mute" id="muteBtn"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg></button>
        <div class="label" data-i18n="mute"></div>
      </div>
      <div>
        <button class="round hang" id="hangBtn"><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1a1 1 0 0 1-.56.9 11.5 11.5 0 0 0-2.66 1.85 1 1 0 0 1-1.41 0L.29 13.08a1 1 0 0 1 0-1.41A16.9 16.9 0 0 1 12 7c4.57 0 8.72 1.8 11.71 4.67a1 1 0 0 1 0 1.41l-2.48 2.49a1 1 0 0 1-1.41 0 11.3 11.3 0 0 0-2.67-1.85 1 1 0 0 1-.55-.9v-3.1A15 15 0 0 0 12 9z"/></svg></button>
        <div class="label" data-i18n="hangUp"></div>
      </div>
    </div>
  </section>

  <section class="card how">
    <h2 data-i18n="howTitle"></h2>
    <ol>
      <li data-i18n="howRegister"></li>
      <li data-i18n="step1"></li>
      <li data-i18n="step2"></li>
      <li data-i18n="step3"></li>
    </ol>
  </section>

  <p class="note" data-i18n="browserNote"></p>

<script src="vendor/peerjs.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
