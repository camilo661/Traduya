<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0369A1">
<title>Traduya</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <nav class="languages" aria-label="Idioma · Language · 语言">
    <button data-lang="es">Español</button>
    <button data-lang="en">English</button>
    <button data-lang="zh">中文</button>
  </nav>

  <div class="logo" aria-hidden="true">
    <svg width="40" height="40" viewBox="0 0 40 40"><path d="M27.4 12.6 A10.5 10.5 0 1 0 27.4 27.4" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/></svg>
  </div>
  <h1>Traduya</h1>
  <p class="sub" data-i18n="subtitle"></p>

  <!-- Paso 1: iniciar sesión (obligatorio para llamar) -->
  <section class="card hidden" id="loginCard">
    <h2 data-i18n="loginTitle"></h2>
    <p class="muted" data-i18n="loginWhy"></p>
    <button class="wide google" id="googleBtn">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.7A14.6 14.6 0 0 1 9.5 24c0-1.6.3-3.2.9-4.7l-7.8-6A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.9-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.2-8.5 2.2-6.3 0-11.6-4.1-13.5-9.8l-7.9 6C6.6 42.6 14.6 48 24 48z"/></svg>
      <span data-i18n="google"></span>
    </button>
    <div class="divider"><span data-i18n="or"></span></div>
    <form id="emailForm">
      <input id="emailInput" type="email" autocomplete="email" data-i18n-placeholder="emailPlaceholder" required>
      <button class="wide secondary" type="submit" data-i18n="sendLink"></button>
    </form>
    <p class="message" id="loginMessage"></p>
  </section>

  <!-- Paso 2: llamar -->
  <section class="card hidden" id="callCard">
    <div class="session">
      <span id="sessionName"></span>
      <button class="link" id="signOutBtn" data-i18n="signOut"></button>
    </div>

    <div class="status" id="status"></div>
    <div class="timer" id="timer"></div>
    <input id="targetInput" class="hidden" inputmode="tel" autocapitalize="off" autocomplete="off"
           data-i18n-placeholder="targetPlaceholder">

    <div class="actions">
      <div id="callBox">
        <button class="round call" id="callBtn">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
        </button>
        <div class="label" data-i18n="call"></div>
      </div>
      <div id="muteBox" class="hidden">
        <button class="round mute" id="muteBtn">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
        </button>
        <div class="label" data-i18n="mute"></div>
      </div>
      <div id="hangBox" class="hidden">
        <button class="round hang" id="hangBtn">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1a1 1 0 0 1-.56.9 11.5 11.5 0 0 0-2.66 1.85 1 1 0 0 1-1.41 0L.29 13.08a1 1 0 0 1 0-1.41A16.9 16.9 0 0 1 12 7c4.57 0 8.72 1.8 11.71 4.67a1 1 0 0 1 0 1.41l-2.48 2.49a1 1 0 0 1-1.41 0 11.3 11.3 0 0 0-2.67-1.85 1 1 0 0 1-.55-.9v-3.1A15 15 0 0 0 12 9z"/></svg>
        </button>
        <div class="label" data-i18n="hangUp"></div>
      </div>
    </div>

    <div class="notice" data-i18n="notice"></div>
  </section>

  <section class="card how">
    <h2 data-i18n="howTitle"></h2>
    <ol>
      <li data-i18n="loginTitle"></li>
      <li data-i18n="step1"></li>
      <li data-i18n="step2"></li>
      <li data-i18n="step3"></li>
    </ol>
  </section>

  <p class="note" data-i18n="browserNote"></p>

<script src="vendor/peerjs.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
