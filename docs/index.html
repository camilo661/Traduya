<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0369A1">
<title>Traduya Call</title>
<style>
  :root {
    --sky: #4FC3F7; --deep: #0288D1; --navy: #0C4A6E; --green: #22C55E; --red: #EF4444;
    --text: #FFFFFF; --muted: rgba(255,255,255,.78); --card: rgba(255,255,255,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
    color: var(--text);
    background: linear-gradient(180deg, #0C4A6E 0%, #0369A1 55%, #0EA5E9 100%) fixed;
    display: flex; flex-direction: column; align-items: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  .logo {
    width: 72px; height: 72px; border-radius: 22px; margin-top: 12px;
    background: linear-gradient(135deg, var(--sky), var(--deep));
    display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  h1 { font-size: 26px; margin: 18px 0 4px; }
  .sub { color: var(--muted); text-align: center; max-width: 340px; line-height: 1.45; margin: 0; }
  .card {
    width: 100%; max-width: 380px; margin-top: 28px; padding: 20px;
    background: var(--card); border-radius: 24px; text-align: center;
  }
  .status { font-size: 17px; font-weight: 600; min-height: 24px; }
  .timer { font-variant-numeric: tabular-nums; color: var(--muted); margin-top: 6px; min-height: 20px; }
  .actions { display: flex; gap: 28px; justify-content: center; margin-top: 26px; }
  button {
    border: 0; border-radius: 999px; color: #fff; font-size: 16px; font-weight: 600;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .round { width: 76px; height: 76px; display: grid; place-items: center; }
  .call { background: var(--green); box-shadow: 0 8px 24px rgba(34,197,94,.45); }
  .hang { background: var(--red); box-shadow: 0 8px 24px rgba(239,68,68,.45); }
  .mute { background: rgba(255,255,255,.18); }
  .mute.on { background: #fff; color: var(--deep); }
  .label { font-size: 13px; color: var(--muted); margin-top: 8px; }
  input {
    width: 100%; margin-top: 14px; padding: 14px 16px; border-radius: 14px; border: 0;
    font-size: 18px; text-align: center; letter-spacing: 2px;
  }
  .hidden { display: none !important; }
  .note { color: var(--muted); font-size: 13px; text-align: center; max-width: 340px; margin-top: 24px; line-height: 1.45; }
</style>
</head>
<body>
  <div class="logo" aria-hidden="true">
    <svg width="40" height="40" viewBox="0 0 40 40"><path d="M27.4 12.6 A10.5 10.5 0 1 0 27.4 27.4" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/></svg>
  </div>
  <h1>Traduya Call</h1>
  <p class="sub">Talk normally. The person you are calling reads your words translated into Spanish, live.<br>正常说话。对方会实时看到西班牙语翻译。</p>

  <div class="card">
    <div class="status" id="status">Ready to call · 准备拨打</div>
    <div class="timer" id="timer"></div>
    <input id="code" class="hidden" placeholder="Code · 代码" autocapitalize="off" autocomplete="off">
    <div class="actions">
      <div id="callBox">
        <button class="round call" id="callBtn" aria-label="Call">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
        </button>
        <div class="label">Call · 拨打</div>
      </div>
      <div id="muteBox" class="hidden">
        <button class="round mute" id="muteBtn" aria-label="Mute">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
        </button>
        <div class="label">Mute · 静音</div>
      </div>
      <div id="hangBox" class="hidden">
        <button class="round hang" id="hangBtn" aria-label="Hang up">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1a1 1 0 0 1-.56.9 11.5 11.5 0 0 0-2.66 1.85 1 1 0 0 1-1.41 0L.29 13.08a1 1 0 0 1 0-1.41A16.9 16.9 0 0 1 12 7c4.57 0 8.72 1.8 11.71 4.67a1 1 0 0 1 0 1.41l-2.48 2.49a1 1 0 0 1-1.41 0 11.3 11.3 0 0 0-2.67-1.85 1 1 0 0 1-.55-.9v-3.1A15 15 0 0 0 12 9z"/></svg>
        </button>
        <div class="label">Hang up · 挂断</div>
      </div>
    </div>
  </div>
  <p class="note">Works in Safari and Chrome. Allow the microphone when asked.<br>请在提示时允许使用麦克风。</p>

<script src="peerjs.min.js"></script>
<script>
const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
];

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let code = (params.get('to') || '').trim().toLowerCase();
let peer = null, call = null, localStream = null, remoteAudio = null, timer = null, muted = false, connected = false;

if (!code) $('code').classList.remove('hidden');

function setStatus(text) { $('status').textContent = text; }
function show(id, visible) { $(id).classList.toggle('hidden', !visible); }

function inCallUi(active) {
  show('callBox', !active); show('muteBox', active); show('hangBox', active);
  if (!code) show('code', !active);
}

async function startCall() {
  code = code || $('code').value.trim().toLowerCase();
  if (!code) { setStatus('Enter the code · 输入代码'); return; }
  inCallUi(true);
  setStatus('Connecting… · 连接中…');

  // El audio remoto se prepara dentro del toque del usuario para que iOS permita reproducirlo
  remoteAudio = new Audio();
  remoteAudio.playsInline = true;
  remoteAudio.autoplay = true;

  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
  } catch (e) {
    setStatus('Microphone blocked · 麦克风被阻止');
    inCallUi(false);
    return;
  }

  peer = new Peer({ config: { iceServers: ICE_SERVERS }, debug: 1 });
  peer.on('error', e => {
    window.lastError = e.type;
    // Con la llamada ya conectada el audio va directo entre los dos: los avisos del servidor no la cortan
    if (connected) return;
    setStatus(e.type === 'peer-unavailable'
      ? 'Not available. Ask them to open Traduya · 对方未在线'
      : 'Connection error · 连接错误');
    finish(false);
  });
  peer.on('disconnected', () => { if (!connected) setStatus('Reconnecting… · 重新连接…'); });
  peer.on('open', () => {
    setStatus('Ringing… · 呼叫中…');
    call = peer.call('traduya-' + code, localStream);
    call.on('stream', stream => {
      remoteAudio.srcObject = stream;
      remoteAudio.play().catch(() => {});
      connected = true;
      setStatus('Connected · 已接通');
      startTimer();
    });
    call.on('close', () => finish(true));
    call.on('error', () => finish(true));
    const pc = call.peerConnection;
    if (pc) pc.addEventListener('connectionstatechange', () => {
      if (pc.connectionState === 'failed') { setStatus('Connection lost · 连接中断'); finish(false); }
    });
  });
}

function startTimer() {
  const start = Date.now();
  clearInterval(timer);
  timer = setInterval(() => {
    const s = Math.floor((Date.now() - start) / 1000);
    $('timer').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }, 500);
}

function finish(showEnded) {
  connected = false;
  clearInterval(timer);
  try { if (call) call.close(); } catch (e) {}
  call = null;
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  localStream = null;
  if (peer) { peer.destroy(); peer = null; }
  if (remoteAudio) remoteAudio.srcObject = null;
  muted = false; $('muteBtn').classList.remove('on');
  inCallUi(false);
  if (showEnded) setStatus('Call ended · 通话结束');
}

$('callBtn').onclick = startCall;
$('hangBtn').onclick = () => finish(true);
$('muteBtn').onclick = () => {
  muted = !muted;
  $('muteBtn').classList.toggle('on', muted);
  if (localStream) localStream.getAudioTracks().forEach(t => { t.enabled = !muted; });
};

// Solo para pruebas automáticas: ?autocall=1 llama sin tocar el botón
if (params.get('autocall') === '1') startCall();
</script>
</body>
</html>
